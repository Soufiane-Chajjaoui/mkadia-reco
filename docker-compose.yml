version: '3.9'

services:
  # ============================================
  # 🐘 Zookeeper
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - mkadia-net

  # ============================================
  # 🔥 Kafka
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - mkadia-net

  # ============================================
  # 🔥 Spark Master + 2 Workers
  # ============================================
  spark-master:
    build:
      context: ./spark
    container_name: spark-master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8081:8080"
    networks:
      - mkadia-net

  spark-worker-1:
    build:
      context: ./spark
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4G
    networks:
      - mkadia-net

  spark-worker-2:
    build:
      context: ./spark
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4G
    networks:
      - mkadia-net

  # ============================================
  # 🧊 Iceberg + Nessie Catalog
  # ============================================
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    networks:
      - mkadia-net

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    depends_on:
      - nessie
      - minio  # utiliser MinIO existant
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://mkadia-objects
      CATALOG_S3_ENDPOINT: http://mkadia-api-minio:9000
      CATALOG_S3_ACCESS_KEY: minioadmin
      CATALOG_S3_SECRET_KEY: minioadmin
      CATALOG_CATALOG__URI: http://nessie:19120/api/v2
    networks:
      - mkadia-net

networks:
  mkadia-net:
    external: true
