version: '3.9'

services:
  # ========================
  # 🐘 ZOOKEEPER
  # ========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - mkadia-reco-net

  # ========================
  # 🔥 KAFKA
  # ========================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - mkadia-reco-net

  # ========================
  # 🧭 Kafka UI
  # ========================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mkadia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - mkadia-reco-net

  # ========================
  # 🔥 Spark Master
  # ========================
  spark-master:
    build:
      context: ./spark
    container_name: spark-master
    user: root
    environment:
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "7077:7077"   # Spark Master
      - "8081:8080"   # UI Master
    volumes:
      - ./spark/custom-jars:/opt/spark/custom-jars
      - ./spark/apps:/opt/spark/apps
      - ./spark/data:/opt/spark/data
      - ./spark/models:/opt/spark/models
    depends_on:
      kafka:
        condition: service_started
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - mkadia-reco-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================
  # 🔥 Spark Worker 1
  # ========================
  spark-worker-1:
    build:
      context: ./spark
    container_name: spark-worker-1
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark/custom-jars:/opt/spark/custom-jars
      - ./spark/apps:/opt/spark/apps
      - ./spark/data:/opt/spark/data
      - ./spark/models:/opt/spark/models
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - mkadia-reco-net

  # ========================
  # 🔥 Spark Worker 2
  # ========================
  spark-worker-2:
    build:
      context: ./spark
    container_name: spark-worker-2
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark/custom-jars:/opt/spark/custom-jars
      - ./spark/apps:/opt/spark/apps
      - ./spark/data:/opt/spark/data
      - ./spark/models:/opt/spark/models
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - mkadia-reco-net

  # ========================
  # 📦 MinIO (Object Storage)
  # ========================
  minio-reco:
    image: minio/minio:latest
    container_name: minio-reco
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9021
    ports:
      - "9020:9000"  # API port
      - "9021:9001"  # Console port
    volumes:
      - minio-reco-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mkadia-reco-net
    restart: always

  # ========================
  # 🐝 Hive MetaStore (with PostgreSQL Backend)
  # ========================
  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_HEAPSIZE: 2048
    ports:
      - "9083:9083"
    volumes:
      - hive-metastore-data:/opt/hive/data
      - ./hive-warehouse:/user/hive/warehouse
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    networks:
      - mkadia-reco-net
    restart: always

  # ========================
  # 🧊 Iceberg REST Catalog
  # ========================
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8084:8080"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT: http://minio-reco:9000
      WAREHOUSE_PATH: s3://mkadia-warehouse
      S3_ENDPOINT: http://minio-reco:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio-reco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/config"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mkadia-reco-net
    restart: always

networks:
  mkadia-reco-net:
    driver: bridge

volumes:
  minio-reco-data:
  hive-metastore-data:


